name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: bz_generator.exe
            asset_name: bz_generator-windows.exe
            sep: ";"
          - os: ubuntu-latest
            artifact_name: bz_generator
            asset_name: bz_generator-linux
            sep: ":"
          - os: macos-latest
            artifact_name: bz_generator
            asset_name: bz_generator-macos
            sep: ":"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import bz_generator

          font_path = bz_generator.resource_path("Orbitron-Bold.ttf")
          preview, alpha = bz_generator.generate_sheet_image(
              font_path,
              font_path,
              0,
              5,
              0,
              0,
              0,
              55,
              False,
              False,
          )
          assert preview.size == (1024, 1024)
          assert alpha.size == (1024, 1024)

          out_path = Path("smoke-test.dds")
          bz_generator.save_as_dds_native(alpha, out_path)
          assert out_path.exists()
          assert out_path.stat().st_size > 128
          PY

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --add-data "Orbitron-Bold.ttf${{ matrix.sep }}." --add-data "BZONE.ttf${{ matrix.sep }}." bz_generator.py

      - name: Rename binary
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/bz_generator-windows.exe/bz_generator-windows.exe
            artifacts/bz_generator-linux/bz_generator-linux
            artifacts/bz_generator-macos/bz_generator-macos
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
