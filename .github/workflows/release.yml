name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: BZFontGenerator.exe
            sep: ";"
          - os: ubuntu-latest
            platform: linux
            artifact_name: BZFontGenerator
            sep: ":"
          - os: macos-latest
            platform: macos
            artifact_name: BZFontGenerator
            sep: ":"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import bz_generator

          font_path = bz_generator.resource_path("Orbitron-Bold.ttf")
          preview, alpha = bz_generator.generate_sheet_image(
              font_path,
              font_path,
              0,
              5,
              0,
              0,
              0,
              55,
              False,
              False,
          )
          assert preview.size == (1024, 1024)
          assert alpha.size == (1024, 1024)

          out_path = Path("smoke-test.dds")
          bz_generator.save_as_dds_native(alpha, out_path)
          assert out_path.exists()
          assert out_path.stat().st_size > 128
          PY

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate Windows version metadata
        if: matrix.os == 'windows-latest'
        run: |
          python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m PyInstaller --noconsole --onefile --name BZFontGenerator --icon "branding/app_icon.ico" --version-file "branding/version_info.txt" --add-data "branding/app_icon.ico${{ matrix.sep }}branding" --add-data "Orbitron-Bold.ttf${{ matrix.sep }}." --add-data "BZONE.ttf${{ matrix.sep }}." --add-data "branding/app_icon.png${{ matrix.sep }}branding" --runtime-hook branding/pyinstaller_icon_hook.py bz_generator.py

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          python -m PyInstaller --noconsole --onefile --name BZFontGenerator --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico${{ matrix.sep }}branding" --add-data "Orbitron-Bold.ttf${{ matrix.sep }}." --add-data "BZONE.ttf${{ matrix.sep }}." --add-data "branding/app_icon.png${{ matrix.sep }}branding" --runtime-hook branding/pyinstaller_icon_hook.py bz_generator.py

      - name: Verify standalone executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\BZFontGenerator.exe" -PathType Leaf)) {
            throw "Expected standalone dist\BZFontGenerator.exe was not produced"
          }
          if (Test-Path ".\dist\BZFontGenerator" -PathType Container) {
            throw "Unexpected onedir bundle dist\BZFontGenerator was produced"
          }
          Get-Item ".\dist\BZFontGenerator.exe"

      - name: Verify standalone executable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/BZFontGenerator
          test ! -d dist/BZFontGenerator
          chmod +x dist/BZFontGenerator
          ls -lh dist/BZFontGenerator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone98ReduxFontGenerator-${{ matrix.platform }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package versioned release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-packages/windows release-packages/linux release-packages/macos

          cp release-artifacts/Battlezone98ReduxFontGenerator-windows/BZFontGenerator.exe release-packages/windows/
          cp release-artifacts/Battlezone98ReduxFontGenerator-linux/BZFontGenerator release-packages/linux/
          cp release-artifacts/Battlezone98ReduxFontGenerator-macos/BZFontGenerator release-packages/macos/

          chmod +x release-packages/linux/BZFontGenerator release-packages/macos/BZFontGenerator

          (cd release-packages/windows && zip -q ../Battlezone98ReduxFontGenerator-${RELEASE_TAG}-windows.zip BZFontGenerator.exe)
          (cd release-packages/linux && tar -czf ../Battlezone98ReduxFontGenerator-${RELEASE_TAG}-linux.tar.gz BZFontGenerator)
          (cd release-packages/macos && tar -czf ../Battlezone98ReduxFontGenerator-${RELEASE_TAG}-macos.tar.gz BZFontGenerator)

          ls -lh release-packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-packages/Battlezone98ReduxFontGenerator-v*-windows.zip
            release-packages/Battlezone98ReduxFontGenerator-v*-linux.tar.gz
            release-packages/Battlezone98ReduxFontGenerator-v*-macos.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
